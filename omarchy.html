<!DOCTYPE html>
<html lang="en" data-theme="tokyo-night" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Omarchy 4.0.4 (Quattro) — web clone</title>
<meta name="description" content="A high-fidelity, zero-install reconstruction of the Omarchy Linux desktop: Hyprland-style tiling, the Quattro Quickshell bar and menu, all 23 themes, and the full hotkey table. One file, no dependencies, no network.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='none' stroke='%237aa2f7' stroke-width='9' stroke-linecap='round' stroke-dasharray='176 76' transform='rotate(-58 50 50)'/%3E%3Ccircle cx='50' cy='50' r='15' fill='%237aa2f7'/%3E%3C/svg%3E">
<style>
/* ============================================================================
 * Omarchy Web Clone — omarchy.css
 * ----------------------------------------------------------------------------
 * Everything visual. Colours come only from CSS custom properties written by
 * themes.js, so all 23 themes restyle the whole desktop with no per-theme CSS.
 * Geometry follows the Quattro shell: a 26 px horizontal bar, 8 px outer gaps,
 * 4 px inner gaps, 10 px window rounding.
 * ==========================================================================*/

:root {
  --radius: 10px;
  --bar-h: 26px;
  --gap-out: 8px;
  --gap-in: 4px;
  --font-mono: "JetBrainsMono Nerd Font", "JetBrains Mono", "Cascadia Code", ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-ui: var(--font-mono);
  --dur: 220ms;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --screen-brightness: 1;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: var(--bg-darker, #000);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}

body { cursor: default; user-select: none; }
.no-anim * { transition: none !important; animation: none !important; }

/* Nightlight: a warm wash over everything, like hyprsunset at 4000K. */
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9000;
  background: rgba(255, 147, 41, 0); transition: background 600ms ease;
}
html.nightlight body::after { background: rgba(255, 147, 41, 0.14); }
#omarchy-desktop { filter: brightness(var(--screen-brightness)); }

/* scrollbars */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); background-clip: content-box; }

/* ============================================================ desktop ==== */
#omarchy-desktop {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  transition: filter 240ms ease;
}
#omarchy-wallpaper { position: absolute; inset: 0; overflow: hidden; z-index: 0; }
.oma-wall {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  opacity: 0; transform: scale(1.04);
  transition: opacity 600ms var(--ease), transform 1400ms var(--ease);
}
.oma-wall.is-in { opacity: 1; transform: scale(1); }
#omarchy-windows { position: relative; flex: 1; z-index: 1; }

/* ================================================================ bar ==== */
.oma-bar {
  position: fixed; left: 0; right: 0; top: 0; height: var(--bar-h); z-index: 500;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 6px; gap: 4px;
  background: var(--bar-bg);
  border-bottom: 1px solid var(--panel-border);
  font-size: 11.5px; line-height: 1;
  transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
}
body.bar-transparent .oma-bar { background: color-mix(in srgb, var(--bar-bg) 62%, transparent); }
body[data-bar-pos="bottom"] .oma-bar { top: auto; bottom: 0; border-bottom: none; border-top: 1px solid var(--panel-border); }
body[data-bar-pos="left"] .oma-bar,
body[data-bar-pos="right"] .oma-bar {
  top: 0; bottom: 0; width: 28px; height: auto; flex-direction: column; right: auto;
  border-bottom: none; border-right: 1px solid var(--panel-border);
}
body[data-bar-pos="right"] .oma-bar { left: auto; right: 0; border-right: none; border-left: 1px solid var(--panel-border); }
body[data-bar-pos="left"] .oma-bar-group, body[data-bar-pos="right"] .oma-bar-group { flex-direction: column; }
body[data-bar-pos="left"] .oma-mod span, body[data-bar-pos="right"] .oma-mod span { display: none; }
.oma-bar.is-hidden { transform: translateY(-100%); opacity: 0; pointer-events: none; }

.oma-bar-group { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; }
.oma-bar-left { justify-content: flex-start; }
.oma-bar-center { justify-content: center; }
.oma-bar-right { justify-content: flex-end; }

.oma-mod {
  display: inline-flex; align-items: center; gap: 5px;
  height: 20px; padding: 0 7px; border-radius: 5px;
  color: var(--fg); cursor: pointer; white-space: nowrap;
  transition: background 140ms ease, color 140ms ease;
}
.oma-mod:hover { background: var(--sel); color: var(--brfg); }
.oma-mod svg { width: 13px; height: 13px; display: block; }
.oma-mod-icon { padding: 0 5px; }
.oma-mod-menu { padding: 0 6px; color: var(--accent); }
.oma-mod-menu:hover { background: var(--accent); color: var(--bg); }
.oma-clock { font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.oma-weather span { color: var(--fg-dark); }
.oma-update { color: var(--yellow); }
.oma-rec { color: var(--red); animation: recpulse 1.6s infinite; }
@keyframes recpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.oma-indicators { display: flex; gap: 2px; }

.oma-workspaces { display: flex; align-items: center; gap: 2px; margin-left: 4px; }
.oma-ws {
  min-width: 18px; height: 18px; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  color: var(--fg-dark); cursor: pointer; font-size: 10.5px;
  border: 1px solid transparent;
  transition: all 150ms ease;
}
.oma-ws:hover { color: var(--brfg); background: var(--sel); }
.oma-ws.is-occupied { color: var(--fg); background: color-mix(in srgb, var(--muted) 45%, transparent); }
.oma-ws.is-active { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
.oma-ws-layout { margin-left: 6px; font-size: 10px; color: var(--fg-dark); text-transform: uppercase; letter-spacing: 0.08em; }

/* ============================================================ windows ==== */
.oma-win {
  position: absolute; top: 0; left: 0;
  display: flex; flex-direction: column;
  background: var(--bg);
  border: 2px solid var(--muted);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 14px 40px -12px var(--shadow), 0 0 0 1px color-mix(in srgb, var(--bg-darker) 70%, transparent);
  opacity: 0;
  animation: winOpen 200ms var(--ease) forwards;
  transition: width 200ms var(--ease), height 200ms var(--ease), transform 200ms var(--ease),
              border-color 160ms ease, opacity 160ms ease, box-shadow 200ms ease;
  will-change: transform, width, height;
}
@keyframes winOpen { from { opacity: 0; } to { opacity: 1; } }
.no-anim .oma-win { animation: none; opacity: 1; }
.oma-win.is-active { border-color: var(--accent); box-shadow: 0 18px 52px -12px var(--shadow), 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
.oma-win.is-floating { box-shadow: 0 22px 60px -14px var(--shadow), 0 0 0 1px color-mix(in srgb, var(--bg-darker) 60%, transparent); }
.oma-win.is-transparent { background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: blur(10px); }
.oma-win.is-square { border-radius: 0; }
.oma-win.is-sticky { box-shadow: 0 0 0 2px var(--yellow), 0 22px 60px -14px var(--shadow); }
.oma-win.is-grouped { border-color: var(--cyan); }
.oma-win.is-max { border-radius: 0; }
.oma-win.oma-win-closing { opacity: 0; transform: scale(0.97); }

.oma-win-chrome {
  height: 22px; min-height: 22px;
  display: flex; align-items: center;
  background: var(--bg-dark);
  border-bottom: 1px solid color-mix(in srgb, var(--muted) 40%, transparent);
  padding: 0 8px; gap: 6px; cursor: grab;
}
.oma-win-chrome:active { cursor: grabbing; }
.oma-win-tabs { flex: 1; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--fg-dark); overflow: hidden; white-space: nowrap; }
.oma-win-grip { width: 34px; height: 12px; opacity: 0.35; background:
  radial-gradient(circle, var(--fg) 1px, transparent 1.2px) 0 0 / 6px 6px; }
.oma-win-body { flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex; }

/* =============================================================== menu ==== */
.oma-menu {
  position: fixed; inset: 0; z-index: 2000;
  display: none; align-items: flex-start; justify-content: center;
  background: color-mix(in srgb, var(--bg-darker) 55%, transparent);
  backdrop-filter: blur(3px);
  padding-top: 8vh;
}
.oma-menu.is-open { display: flex; animation: fadeIn 140ms var(--ease); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.oma-menu-panel {
  width: min(760px, 92vw); max-height: 78vh; display: flex; flex-direction: column;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 14px; overflow: hidden;
  box-shadow: 0 40px 90px -20px var(--shadow);
  animation: menuIn 180ms var(--ease);
}
@keyframes menuIn { from { opacity: 0; transform: translateY(-10px) scale(0.99); } to { opacity: 1; transform: none; } }
.oma-menu-head { display: flex; gap: 10px; padding: 12px 14px 10px; align-items: center; border-bottom: 1px solid var(--panel-border); }
.oma-menu-brand { width: 26px; height: 26px; color: var(--accent); flex: none; }
.oma-menu-brand svg { width: 26px; height: 26px; }
.oma-menu-headmain { flex: 1; min-width: 0; }
.oma-menu-crumbs { display: flex; align-items: center; gap: 3px; font-size: 10.5px; color: var(--fg-dark); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.07em; }
.oma-menu-sep svg { width: 9px; height: 9px; display: block; opacity: 0.6; }
.oma-menu-crumb.is-last { color: var(--accent); }
.oma-menu-input {
  width: 100%; background: transparent; border: none; outline: none;
  color: var(--fg); font-family: var(--font-mono); font-size: 15px; padding: 0;
}
.oma-menu-input::placeholder { color: var(--fg-dark); }
.oma-menu-list { overflow-y: auto; padding: 6px; flex: 1; }
.oma-menu-row {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: 8px; cursor: pointer;
}
.oma-menu-row.is-sel { background: var(--sel); }
.oma-menu-row.is-sel .oma-menu-name { color: var(--brfg); }
.oma-menu-icon { width: 17px; height: 17px; color: var(--accent); flex: none; }
.oma-menu-icon svg { width: 17px; height: 17px; display: block; }
.oma-menu-main { flex: 1; min-width: 0; }
.oma-menu-name { font-size: 13px; color: var(--fg); }
.oma-menu-path { font-size: 10.5px; color: var(--fg-dark); margin-top: 1px; }
.oma-menu-chev { color: var(--fg-dark); }
.oma-menu-chev svg { width: 11px; height: 11px; display: block; }
.oma-menu-check { color: var(--green); }
.oma-menu-check svg { width: 13px; height: 13px; display: block; }
.oma-menu-swatch { display: flex; gap: 2px; }
.oma-menu-swatch i { width: 11px; height: 11px; border-radius: 3px; display: block; }
.oma-menu-empty { padding: 22px; text-align: center; color: var(--fg-dark); }
.oma-menu-foot {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 7px 12px; border-top: 1px solid var(--panel-border);
  font-size: 10.5px; color: var(--fg-dark);
}
.oma-key {
  display: inline-block; padding: 1px 5px; border-radius: 4px;
  background: var(--sel); color: var(--fg); font-size: 10.5px;
  border: 1px solid color-mix(in srgb, var(--muted) 50%, transparent);
}

/* ============================================================== panels === */
#omarchy-panel-host { position: fixed; inset: 0; pointer-events: none; z-index: 1500; }
#omarchy-panel-host.is-open { pointer-events: none; }
.oma-panel {
  position: absolute; top: 30px; left: 50%; width: 340px; max-height: 72vh; overflow-y: auto;
  pointer-events: auto;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border); border-radius: 12px;
  box-shadow: 0 26px 60px -18px var(--shadow);
  animation: panelIn 160ms var(--ease);
}
@keyframes panelIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
.oma-panel-head { display: flex; align-items: center; gap: 9px; padding: 12px 14px 8px; }
.oma-panel-icon { width: 16px; height: 16px; color: var(--accent); }
.oma-panel-icon svg { width: 16px; height: 16px; display: block; }
.oma-panel-title { font-size: 13px; font-weight: 600; }
.oma-panel-body { padding: 0 14px 14px; }
.oma-panel-sub { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-dark); margin: 12px 0 6px; }
.oma-panel-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 8px 10px; border-radius: 8px; cursor: pointer;
}
.oma-panel-item:hover { background: var(--sel); }
.oma-panel-item.is-active { background: var(--sel); }
.oma-panel-meta { font-size: 11px; color: var(--fg-dark); }
.oma-panel-check { color: var(--green); }
.oma-panel-check svg { width: 13px; height: 13px; display: block; }
.oma-panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.oma-panel-row-label { font-size: 12px; }
.oma-panel-empty { color: var(--fg-dark); font-size: 12px; padding: 6px 0; }

.oma-slider { margin: 10px 0; }
.oma-slider-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 7px; }
.oma-slider-label { display: flex; align-items: center; gap: 7px; font-size: 12px; }
.oma-slider-label svg { width: 14px; height: 14px; color: var(--accent); }
.oma-slider-val { font-size: 11px; color: var(--fg-dark); font-variant-numeric: tabular-nums; }
.oma-slider-bar { height: 7px; border-radius: 4px; background: var(--sel); overflow: hidden; cursor: pointer; }
.oma-slider-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 90ms linear; }

.oma-btn {
  font-family: var(--font-mono); font-size: 11.5px;
  background: var(--sel); color: var(--fg);
  border: 1px solid color-mix(in srgb, var(--muted) 55%, transparent);
  border-radius: 7px; padding: 5px 11px; cursor: pointer;
  transition: background 140ms ease, border-color 140ms ease, color 140ms ease;
}
.oma-btn:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.oma-btn-sm { padding: 3px 8px; font-size: 11px; }
.oma-btn-wide { width: 100%; margin-top: 10px; }
.oma-btn-primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.oma-btn.is-active { background: var(--accent); color: var(--bg); }
.oma-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.oma-chip {
  font-family: var(--font-mono); font-size: 11px; padding: 4px 9px; border-radius: 999px;
  background: var(--sel); color: var(--fg); cursor: pointer;
  border: 1px solid color-mix(in srgb, var(--muted) 45%, transparent);
}
.oma-chip:hover { border-color: var(--accent); }
.oma-chip.is-active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.oma-empty { color: var(--fg-dark); padding: 16px; text-align: center; font-size: 12px; }
.oma-value { font-size: 11.5px; color: var(--fg-dark); }

.oma-power-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.oma-power-btn {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 12px 8px; border-radius: 10px; cursor: pointer;
  background: var(--sel); color: var(--fg); font-family: var(--font-mono); font-size: 11.5px;
  border: 1px solid transparent;
}
.oma-power-btn:hover { background: var(--accent); color: var(--bg); }
.oma-power-icon svg { width: 18px; height: 18px; display: block; }

.oma-cal-head { text-align: center; font-size: 12.5px; margin-bottom: 8px; color: var(--accent); }
.oma-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.oma-cal-dow { text-align: center; font-size: 10px; color: var(--fg-dark); padding: 3px 0; }
.oma-cal-day { text-align: center; font-size: 11px; padding: 5px 0; border-radius: 6px; }
.oma-cal-day:hover { background: var(--sel); }
.oma-cal-day.is-today { background: var(--accent); color: var(--bg); font-weight: 600; }
.oma-cal-day.is-blank { opacity: 0; }

.oma-hist-row, .oma-clip-row { display: flex; gap: 9px; align-items: flex-start; padding: 8px 6px; border-radius: 8px; cursor: pointer; }
.oma-hist-row:hover, .oma-clip-row:hover { background: var(--sel); }
.oma-hist-icon, .oma-clip-app { color: var(--accent); flex: none; }
.oma-hist-icon svg { width: 14px; height: 14px; display: block; }
.oma-hist-main, .oma-clip-text { flex: 1; min-width: 0; }
.oma-hist-sum { font-size: 12px; }
.oma-hist-body { font-size: 11px; color: var(--fg-dark); word-break: break-word; }
.oma-hist-time, .oma-clip-time { font-size: 10px; color: var(--fg-dark); flex: none; }
.oma-clip-app { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; width: 68px; }
.oma-clip-text { font-size: 11.5px; font-family: var(--font-mono); word-break: break-word; white-space: pre-wrap; }

/* ======================================================= notifications === */
.oma-notifications { position: fixed; top: 32px; right: 10px; z-index: 1800; display: flex; flex-direction: column; gap: 8px; width: 340px; }
.oma-notif {
  display: flex; gap: 10px; padding: 11px 12px;
  background: var(--panel-bg); border: 1px solid var(--panel-border);
  border-left: 3px solid var(--accent);
  border-radius: 10px; box-shadow: 0 18px 44px -16px var(--shadow);
  opacity: 0; transform: translateX(24px);
  transition: opacity 200ms var(--ease), transform 200ms var(--ease);
  cursor: pointer; pointer-events: auto;
}
.oma-notif.is-in { opacity: 1; transform: none; }
.oma-notif.is-out { opacity: 0; transform: translateX(24px); }
.oma-notif-icon { color: var(--accent); flex: none; margin-top: 1px; }
.oma-notif-icon svg { width: 15px; height: 15px; display: block; }
.oma-notif-content { flex: 1; min-width: 0; }
.oma-notif-app { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--fg-dark); }
.oma-notif-summary { font-size: 12.5px; font-weight: 600; margin-top: 2px; }
.oma-notif-body { font-size: 11.5px; color: var(--fg-light); margin-top: 3px; word-break: break-word; }
.oma-notif-actions { display: flex; gap: 6px; margin-top: 8px; }
.oma-notif-close { color: var(--fg-dark); cursor: pointer; flex: none; }
.oma-notif-close:hover { color: var(--red); }
.oma-notif-close svg { width: 12px; height: 12px; display: block; }

/* ================================================================= OSD === */
.oma-osd {
  position: fixed; left: 50%; bottom: 8%; transform: translate(-50%, 12px);
  z-index: 1900; display: flex; align-items: center; gap: 12px;
  padding: 12px 18px; min-width: 240px;
  background: var(--osd-bg); border: 1px solid var(--panel-border);
  border-radius: 12px; box-shadow: 0 20px 50px -18px var(--shadow);
  opacity: 0; pointer-events: none;
  transition: opacity 180ms var(--ease), transform 180ms var(--ease);
}
.oma-osd.is-visible { opacity: 1; transform: translate(-50%, 0); }
.oma-osd-icon { color: var(--accent); }
.oma-osd-icon svg { width: 20px; height: 20px; display: block; }
.oma-osd-bar { flex: 1; height: 7px; min-width: 130px; border-radius: 4px; background: var(--sel); overflow: hidden; }
.oma-osd-fill { height: 100%; background: var(--accent); transition: width 100ms linear; }
.oma-osd-val { font-size: 11px; color: var(--fg-dark); font-variant-numeric: tabular-nums; }
.oma-osd-text { display: flex; flex-direction: column; gap: 2px; }
.oma-osd-label { font-size: 12.5px; }
.oma-osd-value { font-size: 11px; color: var(--fg-dark); }

/* ================================================================ lock === */
.oma-lock { position: fixed; inset: 0; z-index: 3000; display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--bg-darker) 82%, transparent); backdrop-filter: blur(22px) saturate(0.8); opacity: 0; transition: opacity 300ms ease; }
.oma-lock.is-in { opacity: 1; }
.oma-lock-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.oma-lock-time { font-size: 68px; font-weight: 300; letter-spacing: -0.02em; color: var(--brfg); font-variant-numeric: tabular-nums; }
.oma-lock-date { font-size: 15px; color: var(--fg-dark); margin-top: -8px; }
.oma-lock-avatar {
  width: 68px; height: 68px; border-radius: 50%; margin-top: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; background: var(--accent); color: var(--bg);
}
.oma-lock-input {
  width: 260px; text-align: center; padding: 9px 14px; margin-top: 8px;
  background: var(--sel); color: var(--fg); font-family: var(--font-mono); font-size: 13px;
  border: 1px solid var(--panel-border); border-radius: 9px; outline: none;
}
.oma-lock-input:focus { border-color: var(--accent); }
.oma-lock-hint { font-size: 11px; color: var(--fg-dark); }

/* ============================================================= overlays = */
.oma-overlay { position: fixed; inset: 0; z-index: 2100; display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--bg-darker) 60%, transparent); padding: 6vh 4vw; }
.oma-overlay-panel { width: min(1000px, 94vw); max-height: 84vh; display: flex; flex-direction: column;
  background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 14px; overflow: hidden;
  box-shadow: 0 40px 90px -24px var(--shadow); }
.oma-overlay-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--panel-border); }
.oma-overlay-title { font-size: 14px; font-weight: 600; }
.oma-overlay-body { padding: 16px; overflow-y: auto; }
.oma-overlay-body.is-mono { font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; line-height: 1.55; }
.oma-overlay-line { white-space: pre-wrap; }
.oma-overlay pre, .oma-overlay-body pre { margin: 0; white-space: pre-wrap; font-family: var(--font-mono); }

.oma-kb-wrap { columns: 2; column-gap: 26px; }
.oma-kb-group { break-inside: avoid; margin-bottom: 16px; }
.oma-kb-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--accent); margin-bottom: 7px; }
.oma-kb-row { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; }
.oma-kb-keys { display: flex; gap: 3px; flex-wrap: wrap; min-width: 168px; }
.oma-kb-desc { flex: 1; font-size: 11.5px; color: var(--fg-light); }

/* ============================================================ terminal === */
.oma-term { flex: 1; display: flex; flex-direction: column; background: var(--bg); font-size: 12.5px; line-height: 1.5; }
.oma-term-scroll { flex: 1; overflow-y: auto; padding: 10px 12px 2px; font-family: var(--font-mono); }
.oma-term-line { white-space: pre-wrap; word-break: break-word; min-height: 1.5em; }

.pt-user { color: var(--green); }
.pt-at { color: var(--fg-dark); }
.pt-host { color: var(--green); }
.pt-colon { color: var(--fg-dark); }
.pt-dir { color: var(--blue); }
.pt-arrow { color: var(--magenta); }
.oma-term-inputrow { display: flex; align-items: center; gap: 0; padding: 0 12px 10px; font-family: var(--font-mono); font-size: 12.5px; }

.oma-term-input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--fg); font-family: var(--font-mono); font-size: 12.5px; padding: 0;
  caret-color: var(--accent);
}

/* ============================================================== neovim === */
.oma-nvim { flex: 1; display: flex; flex-direction: column; background: var(--bg); outline: none; }
.oma-nvim-body { flex: 1; display: flex; min-height: 0; }
.oma-nvim-tree { width: 190px; flex: none; background: var(--bg-dark); border-right: 1px solid color-mix(in srgb, var(--muted) 40%, transparent);
  overflow-y: auto; padding: 6px 4px; font-size: 11.5px; }
.oma-nvim-treeroot { color: var(--accent); padding: 3px 6px; font-weight: 600; }
.oma-nvim-treenode { padding: 2px 6px; border-radius: 5px; cursor: pointer; color: var(--fg-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.oma-nvim-treenode:hover { background: var(--sel); color: var(--brfg); }
.oma-nvim-treenode.is-dir { color: var(--blue); }
.oma-nvim-pane { flex: 1; min-width: 0; overflow: hidden; }
.oma-nvim-scroll { height: 100%; overflow-y: auto; display: flex; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; padding: 8px 0; }
.oma-nvim-gutter { flex: none; padding: 0 8px 0 10px; color: var(--fg-dark); text-align: right; user-select: none; }
.oma-nvim-ln { cursor: pointer; }
.oma-nvim-ln.is-cur { color: var(--accent); font-weight: 600; }
.oma-nvim-code { flex: 1; min-width: 0; padding-right: 12px; }
.oma-nvim-row { white-space: pre; min-height: 1.55em; }

.s-kw { color: var(--magenta); }
.s-str { color: var(--green); }
.s-num { color: var(--orange); }
.s-com { color: var(--fg-dark); font-style: italic; }
.s-fn { color: var(--blue); }
.s-h1 { color: var(--accent); font-weight: 600; }
.s-bullet { color: var(--cyan); }
.oma-nvim-tabs { display: flex; gap: 1px; background: var(--bg-dark); border-top: 1px solid color-mix(in srgb, var(--muted) 40%, transparent); }
.oma-nvim-tab { padding: 4px 12px; font-size: 11px; color: var(--fg-dark); cursor: pointer; border-right: 1px solid color-mix(in srgb, var(--muted) 30%, transparent); }
.oma-nvim-tab.is-active { background: var(--bg); color: var(--brfg); }
.oma-nvim-status { display: flex; align-items: center; gap: 0; font-size: 11px; background: var(--bg-dark); }
.oma-nvim-mode { padding: 3px 10px; font-weight: 600; color: var(--bg); background: var(--accent); }
.oma-nvim-mode.mode-i { background: var(--green); }

.oma-nvim-mode.mode-\\: { background: var(--yellow); }
.oma-nvim-file { padding: 3px 10px; color: var(--fg); }
.oma-nvim-meta { padding: 3px 10px; color: var(--fg-dark); margin-left: auto; }
.oma-nvim-meta + .oma-nvim-meta { margin-left: 0; }
.oma-nvim-cmdline { min-height: 20px; padding: 2px 10px; font-family: var(--font-mono); font-size: 12px; color: var(--fg); background: var(--bg-dark); }

.oma-nvim-dash { padding: 26px; display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
.oma-nvim-logo { color: var(--accent); font-size: 11px; line-height: 1.15; margin: 0; }
.oma-nvim-dashtitle { color: var(--fg); font-size: 14px; letter-spacing: 0.05em; }
.oma-nvim-dashkeys { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.oma-nvim-dashrow { display: flex; gap: 10px; align-items: center; font-size: 11.5px; color: var(--fg-light); }

.oma-nvim-dashtip { font-size: 11px; color: var(--fg-dark); margin-top: 6px; }
.oma-nvim-dashfiles { font-size: 11px; color: var(--fg-dark); white-space: pre; line-height: 1.5; margin-top: 4px; }

/* ================================================================ btop === */
.oma-btop { flex: 1; display: flex; flex-direction: column; background: var(--bg); padding: 8px; gap: 8px; font-family: var(--font-mono); font-size: 11.5px; min-height: 0; overflow: hidden; }

.oma-btop-card { background: var(--bg-dark); border: 1px solid color-mix(in srgb, var(--muted) 40%, transparent); border-radius: 8px; padding: 7px 9px; display: flex; flex-direction: column; min-width: 0; }
.oma-btop-cardhead { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
.oma-btop-cardlabel { color: var(--accent); text-transform: uppercase; font-size: 10px; letter-spacing: 0.07em; }
.oma-btop-val { color: var(--fg); font-variant-numeric: tabular-nums; }

.oma-btop-load { color: var(--fg-dark); font-size: 10.5px; margin-top: 4px; }
.oma-btop-proc { flex: 1; min-height: 0; background: var(--bg-dark); border: 1px solid color-mix(in srgb, var(--muted) 40%, transparent); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
.oma-btop-prochead { display: grid; grid-template-columns: 60px 70px 60px 60px 1fr; padding: 6px 10px; color: var(--accent); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid color-mix(in srgb, var(--muted) 35%, transparent); }
.oma-btop-table { width: 100%; border-collapse: collapse; overflow-y: auto; }

.oma-btop-table td.is-hot { color: var(--red); }
.oma-btop-cmd { color: var(--fg); }

/* ======================================================== file manager == */
.oma-files { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
.oma-files-toolbar { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid color-mix(in srgb, var(--muted) 40%, transparent); }
.oma-files-crumbs { flex: 1; display: flex; align-items: center; gap: 3px; font-size: 11.5px; overflow: hidden; white-space: nowrap; }
.oma-crumb { cursor: pointer; color: var(--fg-light); padding: 2px 4px; border-radius: 4px; }
.oma-crumb:hover { background: var(--sel); color: var(--brfg); }
.oma-crumb-sep { color: var(--fg-dark); }
.oma-crumb-sep svg { width: 9px; height: 9px; display: block; }
.oma-files-actions { display: flex; gap: 6px; }
.oma-files-main { flex: 1; display: flex; min-height: 0; }
.oma-files-cols { width: 46%; overflow-y: auto; border-right: 1px solid color-mix(in srgb, var(--muted) 40%, transparent); outline: none; }
.oma-files-row { display: flex; align-items: center; gap: 8px; padding: 5px 10px; cursor: pointer; font-size: 12px; }

.oma-files-icon svg { width: 14px; height: 14px; display: block; }
.oma-files-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.oma-files-preview { flex: 1; overflow-y: auto; padding: 12px; min-width: 0; }
.oma-files-prevhead { font-size: 13px; font-weight: 600; word-break: break-word; }
.oma-files-prevmeta { font-size: 10.5px; color: var(--fg-dark); margin: 4px 0 10px; }
.oma-files-prevtext { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-light); white-space: pre-wrap; word-break: break-word; margin: 0; line-height: 1.55; }
.oma-files-prevlist { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-light); white-space: pre; line-height: 1.6; }
.oma-files-previmg { max-height: 320px; overflow: hidden; border-radius: 8px; border: 1px solid var(--panel-border); margin-bottom: 10px; }
.oma-files-previmg svg { display: block; width: 100%; height: auto; }
.oma-files-prevactions { display: flex; gap: 6px; margin-top: 12px; }

/* ============================================================= lazygit == */
.oma-lazygit { flex: 1; background: var(--bg); padding: 10px; display: flex; flex-direction: column; gap: 8px; font-family: var(--font-mono); font-size: 12px; }
.oma-lazygit-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; min-height: 0; }
.oma-lazygit-panel { background: var(--bg-dark); border: 1px solid color-mix(in srgb, var(--muted) 40%, transparent); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
.oma-lazygit-panel.is-active { border-color: var(--accent); }
.oma-lazygit-title { padding: 5px 10px; color: var(--accent); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; }
.oma-lazygit-body { margin: 0; padding: 4px 10px 8px; overflow-y: auto; color: var(--fg-light); white-space: pre-wrap; }
.oma-lazygit-help { font-size: 10.5px; color: var(--fg-dark); }

/* ============================================================ browser === */
.oma-browser { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
.oma-browser-tabs { display: flex; align-items: center; gap: 1px; background: var(--bg-darker); padding: 4px 4px 0; }
.oma-browser-tab { display: flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 8px 8px 0 0; background: var(--bg-dark); color: var(--fg-dark); font-size: 11.5px; cursor: pointer; max-width: 190px; }
.oma-browser-tab.is-active { background: var(--bg); color: var(--fg); }
.oma-browser-tabtitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oma-browser-tabclose { opacity: 0.55; }
.oma-browser-tabclose:hover { opacity: 1; color: var(--red); }

.oma-browser-toolbar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--bg); border-bottom: 1px solid color-mix(in srgb, var(--muted) 35%, transparent); }
.oma-browser-btn { padding: 3px 9px; }
.oma-browser-addr { flex: 1; padding: 5px 12px; border-radius: 999px; background: var(--bg-dark); border: 1px solid color-mix(in srgb, var(--muted) 40%, transparent); color: var(--fg); font-family: var(--font-mono); font-size: 12px; outline: none; }
.oma-browser-addr:focus { border-color: var(--accent); }
.oma-browser-bookmarks { display: flex; gap: 4px; padding: 5px 8px; border-bottom: 1px solid color-mix(in srgb, var(--muted) 25%, transparent); flex-wrap: wrap; }
.oma-bookmark { padding: 2px 8px; border-radius: 6px; font-size: 11px; color: var(--fg-light); cursor: pointer; }
.oma-bookmark:hover { background: var(--sel); color: var(--brfg); }
.oma-browser-view { flex: 1; min-height: 0; position: relative; overflow: auto; background: var(--bg-darker); }
.oma-browser-page { min-height: 100%; }
.oma-browser-internal, .oma-preview { background: var(--bg); padding: 26px 32px; }
.oma-browser-frame { width: 100%; height: 100%; min-height: 420px; border: none; background: #fff; display: block; }
.oma-browser-status { padding: 3px 10px; font-size: 10.5px; color: var(--fg-dark); background: var(--bg-dark); border-top: 1px solid color-mix(in srgb, var(--muted) 30%, transparent); }
.oma-page h1 { font-size: 20px; margin: 0 0 8px; }
.oma-page h2 { font-size: 14px; color: var(--accent); margin: 20px 0 8px; }
.oma-page p { font-size: 12.5px; color: var(--fg-light); line-height: 1.65; max-width: 74ch; }
.oma-page-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.oma-page-table td { padding: 4px 8px; vertical-align: top; border-bottom: 1px solid color-mix(in srgb, var(--muted) 22%, transparent); }
.oma-page-table td:first-child { width: 240px; white-space: nowrap; }
.oma-page-home { text-align: center; padding-top: 8vh; }
.oma-home-logo { color: var(--accent); margin-bottom: 10px; }
.oma-home-title { font-size: 34px; margin: 0; letter-spacing: -0.02em; }
.oma-home-sub { color: var(--fg-dark); font-size: 13px; max-width: none; }
.oma-home-search { width: min(520px, 80%); margin: 18px 0; padding: 10px 18px; border-radius: 999px; background: var(--bg-dark); border: 1px solid var(--panel-border); color: var(--fg); font-family: var(--font-mono); font-size: 13px; outline: none; text-align: center; }

.oma-home-tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 620px; margin: 0 auto; }

.oma-preview { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.oma-preview-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--sel); color: var(--yellow); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; }
.oma-preview-badge svg { width: 12px; height: 12px; display: block; }
.oma-preview-host { font-size: 11.5px; color: var(--fg-dark); font-family: var(--font-mono); }
.oma-preview-title { font-size: 26px; margin: 2px 0 0; }
.oma-preview-blurb { font-size: 13px; color: var(--fg-light); max-width: 70ch; }
.oma-preview-card { background: var(--bg-dark); border: 1px solid color-mix(in srgb, var(--muted) 40%, transparent); border-radius: 10px; padding: 14px 16px; margin-top: 8px; max-width: 78ch; }
.oma-preview-cardhead { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent); margin-bottom: 6px; }
.oma-preview-card p { font-size: 12px; color: var(--fg-light); margin: 0 0 8px; }
.oma-preview-actions { display: flex; gap: 8px; margin-top: 12px; }
.oma-theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
.oma-theme-card { border: 1px solid color-mix(in srgb, var(--muted) 45%, transparent); border-radius: 10px; padding: 8px; cursor: pointer; background: var(--bg-dark); }
.oma-theme-card:hover { border-color: var(--accent); }
.oma-theme-card.is-active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.oma-theme-swatch { display: flex; border-radius: 6px; overflow: hidden; height: 30px; }
.oma-theme-swatch i { flex: 1; display: block; }
.oma-theme-name { font-size: 11.5px; margin-top: 6px; }
.oma-theme-mode { font-size: 10px; color: var(--fg-dark); }
.oma-theme-grid-sm { grid-template-columns: repeat(auto-fill, minmax(126px, 1fr)); }

/* ============================================================== webapp === */
.oma-webapp { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
.oma-webapp-bar { display: flex; align-items: center; gap: 7px; padding: 6px 10px; background: var(--bg-dark); border-bottom: 1px solid color-mix(in srgb, var(--muted) 35%, transparent); }
.oma-webapp-dot { width: 9px; height: 9px; border-radius: 50%; }
.oma-webapp-url { flex: 1; font-size: 11px; color: var(--fg-dark); font-family: var(--font-mono); }
.oma-webapp-key { font-size: 10px; color: var(--fg-dark); }
.oma-webapp-frame { flex: 1; min-height: 0; overflow: auto; }
.oma-webapp-frame iframe { width: 100%; height: 100%; min-height: 400px; border: none; background: #fff; }

/* ============================================================== viewer === */
.oma-viewer { flex: 1; display: flex; flex-direction: column; background: var(--bg-darker); outline: none; }
.oma-viewer-stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 14px; }
.oma-viewer-img { max-width: 100%; max-height: 100%; border-radius: 8px; overflow: hidden; box-shadow: 0 20px 50px -20px var(--shadow); transition: transform 140ms var(--ease); }
.oma-viewer-img svg { display: block; max-width: 100%; max-height: 78vh; width: auto; height: auto; }
.oma-viewer-info { padding: 7px 12px; font-size: 11px; color: var(--fg-dark); background: var(--bg-dark); text-align: center; }

/* =============================================================== media === */
.oma-media { flex: 1; display: flex; flex-direction: column; background: var(--bg-darker); }
.oma-media-screen { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.oma-media-art { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
.oma-media-bars { display: flex; align-items: flex-end; gap: 4px; height: 110px; }
.oma-media-bars i { width: 6px; border-radius: 3px; display: block; transition: height 500ms var(--ease); }
.oma-media-name { font-size: 13px; color: var(--fg); letter-spacing: 0.04em; }
.oma-media-controls { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--bg-dark); }
.oma-media-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--sel); overflow: hidden; cursor: pointer; }
.oma-media-fill { height: 100%; background: var(--accent); }
.oma-media-time { font-size: 11px; color: var(--fg-dark); font-variant-numeric: tabular-nums; }

/* =============================================================== agent === */
.oma-agent { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
.oma-agent-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid color-mix(in srgb, var(--muted) 35%, transparent); }
.oma-agent-avatar { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--bg); display: flex; align-items: center; justify-content: center; }
.oma-agent-avatar svg { width: 17px; height: 17px; }
.oma-agent-name { font-size: 13px; font-weight: 600; }
.oma-agent-sub { font-size: 10.5px; color: var(--fg-dark); }
.oma-agent-log { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
.oma-agent-msg { max-width: 78%; }
.oma-agent-msg.me { align-self: flex-end; text-align: right; }
.oma-agent-who { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent); margin-bottom: 3px; }

.oma-agent-text { font-size: 12.5px; line-height: 1.6; color: var(--fg-light); background: var(--bg-dark); padding: 8px 11px; border-radius: 10px; text-align: left; }

.oma-agent-inputrow { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-top: 1px solid color-mix(in srgb, var(--muted) 35%, transparent); }
.oma-agent-caret { color: var(--accent); }
.oma-agent-input { flex: 1; background: transparent; border: none; outline: none; color: var(--fg); font-family: var(--font-mono); font-size: 12.5px; }

/* ================================================================ calc === */
.oma-calc { flex: 1; display: flex; flex-direction: column; background: var(--bg); padding: 12px; outline: none; }
.oma-calc-expr { text-align: right; font-size: 11px; color: var(--fg-dark); min-height: 15px; }

<script>
/* First line of defence: if anything at all fails to initialise, record it and
   surface it in the DOM instead of leaving a black screen with no explanation.
   Visiting with ?capture=1 also pins a full state report to the page; this is
   band-independent so it works even when the engine itself never loads. */
(function () {
  var bad = [];
  function paint() {
    var pre = document.getElementById('oma-fatal');
    if (!pre) {
      pre = document.createElement('pre');
      pre.id = 'oma-fatal';
      pre.style.cssText = 'position:fixed;left:0;top:0;right:0;z-index:2147483647;background:#1a1b26;' +
        'color:#f7768e;font:12px ui-monospace,monospace;padding:12px;margin:0;white-space:pre-wrap;max-height:70vh;overflow:auto';
      (document.body || document.documentElement).appendChild(pre);
    }
    pre.textContent = '===FATAL===\n' + bad.join('\n') + '\n===END===\n' +
      'Tip: open this file with ?capture=1 for a full state report.';
  }
  function add(msg) { bad.push(msg); paint(); }
  window.addEventListener('error', function (e) {
    var where = e.filename ? e.filename.split('/').pop() + ':' + e.lineno + ':' + e.colno : '?';
    add('error: ' + e.message + '  @ ' + where);
    if (e.error && e.error.stack) add(e.error.stack);
  });
  window.addEventListener('unhandledrejection', function (e) {
    add('unhandled rejection: ' + String((e.reason && e.reason.stack) || e.reason));
  });
  window.__omaFatal = add;
  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      if (!window.OMA) add('OMA namespace was never created — the bundle did not execute.');
      else if (!document.getElementById('oma-report') && /capture=1/.test(location.search) && !window.OMA.__engineAlive) {
        add('engine object exists but the session never reported ready.');
      }
    }, 12000);
  });
})();

<script>
/* ==== core.js =========================================================== */
/* ============================================================================
 * Omarchy Web Clone — core.js
 * ----------------------------------------------------------------------------
 * Engine primitives shared by every subsystem:
 *   Bus    — tiny pub/sub
 *   h/el   — hyperscript-style DOM builder
 *   Store  — persisted reactive state (localStorage)
 *   VFS    — virtual filesystem pre-populated with a realistic Omarchy home,
 *            including ~/.config/hypr/bindings.lua, ~/.config/omarchy/shell.json
 *            and ~/.config/omarchy/themes/<name>/colors.toml, mirroring the
 *            real v4.0.4 layout (configs are Lua/JSON/TOML, not .conf).
 *   fmt    — time / size / path formatting
 * ==========================================================================*/
(function (OMA) {
  'use strict';

  /* ------------------------------------------------------------------ Bus -- */
  function Bus() { this._m = {}; }
  Bus.prototype.on = function (evt, fn) {
    (this._m[evt] = this._m[evt] || []).push(fn);
    return function () { this.off(evt, fn); }.bind(this);
  };
  Bus.prototype.off = function (evt, fn) {
    var a = this._m[evt]; if (!a) return;
    var i = a.indexOf(fn); if (i >= 0) a.splice(i, 1);
  };
  Bus.prototype.emit = function (evt, data) {
    var a = this._m[evt]; if (!a) return;
    a.slice().forEach(function (fn) { try { fn(data); } catch (e) { OMA.log('bus:' + evt, e); } });
  };

  /* ------------------------------------------------------- DOM (hyperscript) */
  /* h('div.cls#id', {props}, children...) */
  function h(sel, props, children) {
    if (props && (props instanceof Node || Array.isArray(props) || typeof props === 'string')) {
      children = props; props = null;
    }
    var tag = 'div', id = null, cls = [];
    var m = String(sel).match(/^([a-zA-Z0-9-]+)?((?:[.#][^.#]+)*)$/);
    if (m) {
      if (m[1]) tag = m[1];
      (m[2] || '').split(/(?=[.#])/).forEach(function (tok) {
        if (tok[0] === '.') cls.push(tok.slice(1));
        else if (tok[0] === '#') id = tok.slice(1);
      });
    }
    var el = document.createElement(tag);
    if (id) el.id = id;
    if (cls.length) el.className = cls.join(' ');
    if (props) {
      for (var k in props) {
        var v = props[k];
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') el.className = (el.className ? el.className + ' ' : '') + v;
        else if (k === 'style' && typeof v === 'object') { for (var s in v) el.style.setProperty(s, v[s]); }
        else if (k === 'text') el.textContent = v;
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'dataset') { for (var d in v) el.dataset[d] = v[d]; }
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);

        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }

    append(el, children);
    return el;
  }
  function append(parent, children) {
    if (children === null || children === undefined || children === false) return;
    if (Array.isArray(children)) { children.forEach(function (c) { append(parent, c); }); return; }
    if (children instanceof Node) { parent.appendChild(children); return; }
    parent.appendChild(document.createTextNode(String(children)));
  }
  function clear(el) { while (el && el.firstChild) el.removeChild(el.firstChild); return el; }
  function frag(children) { var f = document.createDocumentFragment(); append(f, children); return f; }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  /* ---------------------------------------------------------------- Store -- */
  var LS_KEY = 'omarchy-web-clone/v1';
  function Store(defaults) {
    this.data = JSON.parse(JSON.stringify(defaults || {}));
    this.bus = new Bus();
    this._load();
  }
  Store.prototype._load = function () {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      var saved = JSON.parse(raw);
      for (var k in saved) if (Object.prototype.hasOwnProperty.call(this.data, k)) this.data[k] = saved[k];
    } catch (e) { /* storage may be unavailable; run in-memory */ }
  };
  Store.prototype._save = function () {
    try { localStorage.setItem(LS_KEY, JSON.stringify(this.data)); } catch (e) { }
  };
  Store.prototype.get = function (k) { return this.data[k]; };
  Store.prototype.set = function (k, v) {
    var old = this.data[k];
    this.data[k] = v; this._save();
    this.bus.emit('change', { key: k, value: v, old: old });

  Store.prototype.patch = function (obj) { for (var k in obj) this.set(k, obj[k]); };
  Store.prototype.on = function (k, fn) { return this.bus.on('change:' + k, fn); };

  /* ------------------------------------------------------------------ VFS -- */
  function VFS() { this.root = { type: 'dir', name: '', children: {} }; }

  VFS.prototype.mkdirp = function (path) {
    var segs = norm(path).split('/').filter(Boolean);
    var node = this.root;
    segs.forEach(function (s) {
      if (!node.children[s]) node.children[s] = { type: 'dir', name: s, children: {}, mtime: Date.now() };
      node = node.children[s];
      if (node.type !== 'dir') { node.type = 'dir'; node.children = node.children || {}; }
    });
    return node;
  };
  VFS.prototype.write = function (path, content, opts) {
    var p = norm(path), segs = p.split('/').filter(Boolean);
    var file = segs.pop();
    var dir = this.mkdirp('/' + segs.join('/'));
    dir.children[file] = {
      type: 'file', name: file, content: String(content),
      mtime: Date.now(), mode: (opts && opts.mode) || '-rw-r--r--'
    };
    return dir.children[file];
  };
  VFS.prototype.rm = function (path) {
    var p = norm(path), segs = p.split('/').filter(Boolean);
    var file = segs.pop();
    var dir = this.lookup('/' + segs.join('/'));
    if (dir && dir.children && dir.children[file]) { delete dir.children[file]; return true; }
    return false;
  };
  VFS.prototype.lookup = function (path) {
    var segs = norm(path).split('/').filter(Boolean);
    var node = this.root;
    for (var i = 0; i < segs.length; i++) {
      if (!node.children || !node.children[segs[i]]) return null;
      node = node.children[segs[i]];
    }
    return node;
  };
  VFS.prototype.isDir = function (path) { var n = this.lookup(path); return !!(n && n.type === 'dir'); };
  VFS.prototype.exists = function (path) { return !!this.lookup(path); };
  VFS.prototype.read = function (path) {
    var n = this.lookup(path);
    if (!n) return null;
    if (n.type === 'dir') return null;
    return n.content;
  };
  VFS.prototype.list = function (path) {
    var n = this.lookup(path);
    if (!n || n.type !== 'dir') return [];
    return Object.keys(n.children).sort(function (a, b) {
      var A = n.children[a], B = n.children[b];
      if (A.type !== B.type) return A.type === 'dir' ? -1 : 1;
      return a.localeCompare(b);
    }).map(function (k) { return n.children[k]; });
  };
  /* Recursive walk; cb(node, path). */
  VFS.prototype.walk = function (path, cb) {
    var self = this;
    (function rec(p) {
      self.list(p).forEach(function (n) {
        var full = (p === '/' ? '' : p) + '/' + n.name;
        cb(n, full);
        if (n.type === 'dir') rec(full);
      });
    })(norm(path));
  };
  VFS.prototype.glob = function (pattern) {
    var out = [];
    var re = new RegExp('^' + String(pattern).replace(/[.+^${}()|[\]\\]/g, '\\$&')
      .replace(/\*\*/g, '\u0001').replace(/\*/g, '[^/]*').replace(/\u0001/g, '.*').replace(/\?/g, '.') + '$');
    this.walk('/', function (n, p) { if (re.test(p)) out.push(p); });
    return out.sort();
  };

  function norm(p) {
    if (!p) return '/';
    var abs = p[0] === '/';
    var out = [];
    String(p).split('/').forEach(function (s) {
      if (!s || s === '.') return;
      if (s === '..') { out.pop(); return; }
      out.push(s);
    });
    return (abs ? '/' : '') + out.join('/');
  }
  function joinPath() {
    var parts = Array.prototype.slice.call(arguments).filter(function (x) { return x !== '' && x != null; });
    var p = parts.join('/').replace(/\/+/g, '/');
    return p || '/';
  }
  function dirname(p) { var s = norm(p).split('/'); s.pop(); return s.join('/') || '/'; }
  function basename(p) { var s = norm(p).split('/'); return s[s.length - 1] || '/'; }
  function isAbs(p) { return !!p && p[0] === '/'; }

  /* ------------------------------------------------------------------ fmt -- */
  var fmt = {
    pad: function (n, w) { w = w || 2; return String(n).padStart(w, '0'); },
    clock: function (d, withSeconds) {
      d = d || new Date();
      return fmt.pad(d.getHours()) + ':' + fmt.pad(d.getMinutes()) + (withSeconds ? ':' + fmt.pad(d.getSeconds()) : '');
    },
    /* Omarchy's default clock format is "dddd HH:mm". */
    longClock: function (d) {
      d = d || new Date();
      return fmt.weekday(d) + ' ' + fmt.clock(d);
    },
    weekday: function (d) { return ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][(d || new Date()).getDay()]; },
    monthName: function (d) { return ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][(d || new Date()).getMonth()]; },
    /* "d MMMM 'W'ww yyyy" — the bar's alternate clock format. */
    altDate: function (d) {
      d = d || new Date();
      var jan1 = new Date(d.getFullYear(), 0, 1);
      var week = Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
      return d.getDate() + ' ' + fmt.monthName(d) + ' W' + fmt.pad(week) + ' ' + d.getFullYear();
    },
    size: function (bytes) {
      var u = ['B', 'K', 'M', 'G', 'T'], i = 0, n = Number(bytes) || 0;
      while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
      return (i === 0 ? n : n.toFixed(n < 10 ? 1 : 0)) + u[i];
    },
    dur: function (secs) {
      secs = Math.max(0, Math.round(secs));
      var m = Math.floor(secs / 60), s = secs % 60;
      return m + ':' + fmt.pad(s);
    },
    perms: function (node) {
      if (node.type === 'dir') return 'drwxr-xr-x';
      return node.mode || '-rw-r--r--';
    },
    date: function (ts) {
      var d = new Date(ts || Date.now());
      return fmt.monthName(d).slice(0, 3) + ' ' + fmt.pad(d.getDate()) + ' ' + fmt.clock(d);
    },
    iso: function (ts) { var d = new Date(ts || Date.now()); return d.toISOString().slice(0, 10); },
    title: function (s) { return String(s).replace(/\b\w/g, function (c) { return c.toUpperCase(); }); }
  };

  /* ----------------------------------------------------------------- anim -- */
  /* JS-driven tween so the compositor can animate layout geometry. */
  function tween(from, to, ms, onFrame, ease) {
    ease = ease || function (t) { return 1 - Math.pow(1 - t, 3); };
    var start = performance.now();
    var raf = 0, cancelled = false;
    function step(now) {
      if (cancelled) return;
      var t = Math.min(1, (now - start) / ms);
      onFrame(from + (to - from) * ease(t), t);
      if (t < 1) raf = requestAnimationFrame(step); else onFrame(to, 1);
    }
    raf = requestAnimationFrame(step);
    return function () { cancelled = true; cancelAnimationFrame(raf); };
  }

    if (window.console && console.warn) console.warn('[omarchy:' + scope + ']', err);
  }

    /* Two leaves side by side is a valid split; keep it. */
    return node;
  }

  function alloc(node, rect, out) {
    if (!node) return out;
    if (node.type === 'leaf') { out[node.wid] = rect; return out; }
    var r = Math.max(0.08, Math.min(0.92, node.ratio || 0.5));
    var g = WM.gaps ? GAP_IN : 0;
    if (node.dir === 'v') {
      var aw = Math.round((rect.w - g) * r);
      alloc(node.a, { x: rect.x, y: rect.y, w: aw, h: rect.h }, out);
      alloc(node.b, { x: rect.x + aw + g, y: rect.y, w: rect.w - aw - g, h: rect.h }, out);
    } else {
      var ah = Math.round((rect.h - g) * r);
      alloc(node.a, { x: rect.x, y: rect.y, w: rect.w, h: ah }, out);
      alloc(node.b, { x: rect.x, y: rect.y + ah + g, w: rect.w, h: rect.h - ah - g }, out);

    return out;
  }

  /* --------------------------------------------------------------- placement */
  WM.layoutRects = function (wsId) {
    var ws = WM.ws(wsId);
    var rects = {};
    var ls = leaves(ws.tree);
    var mode = ws.layout === 'floating' ? 'floating' : (ws.layout || WM.layout);

    if (mode === 'scrolling') {
      /* niri-style: a horizontal strip, focused column widest. */
      var n = ls.length, colW = 0.62, sideW = 0.16;
      var focusIdx = Math.max(0, ls.findIndex(function (l) { return l.wid === ws.focus; }));
      var total = colW + sideW * (n - 1);
      var x = WM.area.x, y = WM.area.y;
      var offset = Math.max(0, Math.min(total - 1, focusIdx * sideW + sideW - 0.5));
      var shift = -offset * WM.area.w;
      ls.forEach(function (l, i) {
        var wdt = (i === focusIdx ? colW : sideW) * WM.area.w;

        rects[l.wid] = { x: xx, y: y, w: wdt, h: WM.area.h };

        var fh = (w.props && w.props.floatH) || Math.min(520, WM.area.h * 0.68);

        r.y = WM.area.y + (w.props.floatY != null ? w.props.floatY : Math.round((WM.area.h - r.h) / 2));

      }

      if (w.props.fullwidth) { r.x = WM.area.x; r.w = WM.area.w; }
      if (ws.maximize) rects[wid] = { x: WM.area.x, y: WM.area.y, w: WM.area.w, h: WM.area.h };
      if (ws.fullscreen && wid === ws.focus) {
        var host = OMA.$('#omarchy-desktop');
        rects[wid] = { x: 0, y: 0, w: host.clientWidth, h: host.clientHeight };
      }
    });

  };

  /* ------------------------------------------------------------------- ops */
  WM.open = function (appId, arg, opts) {
    opts = opts || {};

    if (!def) { OMA.log('wm', 'unknown app: ' + appId); return null; }
    if (def.single) {
      var existing = WM.findByApp(appId);
      if (existing) { WM.focus(existing.wid); if (def.onReopen) def.onReopen(existing, arg); return existing; }
    }
    var wsId = opts.ws || WM.active;
    var ws = WM.ws(wsId);
    WM._seq = (WM._seq || 0) + 1;
    var wid = 'w' + WM._seq;
    var win = {
      wid: wid, appId: appId, ws: wsId,
      title: opts.title || (def.title ? def.title(arg) : def.name),
      props: {

    WM.windows[wid] = win;
    if (opts.floating || def.floating) {

      win.props.floatY = 48 + (Object.keys(WM.windows).length % 6) * 24;

    } else if (!fl) {

  WM.findByApp = function (appId) {

    if (w.props.floating) { delete w.props.maximize; }

    OMA.bus.emit('wm:changed');
  };
  WM.toggleMaximize = function (wid) {
    var ws = WM.ws();
    wid = wid || ws.focus;
    var w = WM.windows[wid]; if (!w) return;
    w.props.maximize = !w.props.maximize;
    WM.render();
  };
  WM.toggleFullscreen = function (wid) {
    var ws = WM.ws();
    wid = wid || ws.focus;
    var w = WM.windows[wid]; if (!w) return;
    if (ws.fullscreen && w.props._fs) { ws.fullscreen = false; w.props._fs = false; }

    WM.render();
  };
  WM.toggleFullwidth = function (wid) {
    var ws = WM.ws(); wid = wid || ws.focus;
    var w = WM.windows[wid]; if (!w) return;
    w.props.fullwidth = !w.props.fullwidth;
    WM.render();
  };
  WM.togglePseudo = function (wid) {
    var ws = WM.ws(); wid = wid || ws.focus;
    var w = WM.windows[wid]; if (!w) return;
    w.props.pseudo = !w.props.pseudo;
    OMA.bus.emit('osd', { icon: 'layout', label: 'Pseudo', value: w.props.pseudo ? 'stretch' : 'natural' });
  };
  WM.toggleSticky = function (wid) {
    var ws = WM.ws(); wid = wid || ws.focus;
    var w = WM.windows[wid]; if (!w) return;
    w.props.floating = true;
    w.props.sticky = !w.props.sticky;
    OMA.bus.emit('osd', { icon: 'pin', label: 'Sticky', value: w.props.sticky ? 'on' : 'off' });

  };
  WM.toggleTransparency = function (wid) {
    var ws = WM.ws(); wid = wid || ws.focus;
    var w = WM.windows[wid]; if (!w) return;
    w.props.transparent = !w.props.transparent;
    WM.render();
  };
  WM.toggleSquare = function (wid) {
    var w = WM.windows[wid || WM.ws().focus]; if (!w) return;

    WM.render();
  };

    i = (i + (back ? seq.length - 1 : 1)) % seq.length;

  };

  WM.saveWidth = function () {

  };
  WM.restoreWidth = function () {
    var ws = WM.ws();
    if (ws.savedTree) { ws.tree = JSON.parse(JSON.stringify(ws.savedTree)); WM.render(); }
    OMA.bus.emit('osd', { icon: 'arrow', label: 'Window width', value: 'restored' });
  };

  /* ------------------------------------------------------------- grouping */

    var w = WM.windows[wid]; if (!w) return;
    if (WM._groups[wid]) {
      var members = WM._groups[wid];
      delete WM._groups[wid];
      members.forEach(function (m) { if (WM.windows[m]) WM.windows[m].props.group = null; });

  /* ---------------------------------------------------------------- render */

    var live = {};

    Object.keys(rects).forEach(function (wid) {

  function buildBar() {

    setInterval(function () {
      var c = OMA.$('#bar-clock', S.barEl);
      if (c) tickClock(c);
      var m = OMA.$('#bar-monitor', S.barEl);
      if (m && OMA.System) m.textContent = OMA.System.brightness + '%';
    }, 1000);
    OMA.bus.on('theme:changed', function () {
      var idx = OMA.System ? OMA.System.wallIndex : 0;
      renderBar();
    });
    OMA.bus.on('notify', function () { renderBar(); });

    OMA.bus.on('update:available', renderBar);

  function tickClock(node) {
    node.textContent = (OMA.System && OMA.System.clockAlt) ? fmt.altDate() : fmt.longClock();

    el.addEventListener('wheel', function (e) {

      if (!t) return;
      e.preventDefault();
      var d = e.deltaY < 0 ? 1 : -1;
      if (t.id === 'bar-monitor') { OMA.System.brightness = clamp(OMA.System.brightness + d * 2, 10, 100); OMA.System.applyDisplay(); OMA.Shell.osd({ icon: 'sun', label: 'Brightness', value: OMA.System.brightness + '%' }); }
      else OMA.System.setVolume(OMA.System.volume + d * 2);
    }, { passive: false });
  }

    var host = OMA.$('#bar-workspaces', S.barEl); if (!host) return;
    clear(host);

    });

  function neofetchLines() {
    var t = OMA.Themes.current;
    var art = [
      '                    ///                    ',
      '                 ///////                  ',
      '              ///////////                 ',
      '           ///////  ///////               ',
      '        ///////        ///////            ',
      '     ////////////////////////////         ',
      '   ///////                    ///////     ',
      '  /////////////////////////////////       '
    ];
    var info = [
      user() + '@' + HOSTNAME,
      '-----------------------',
      'OS: Omarchy 4.0.4 (Quattro) x86_64',
      'Kernel: linux-omarchy 6.16.4',
      'WM: Hyprland (Lua config)',
      'Shell: bash 5.3.3',
      'Terminal: Foot',
      'Theme: ' + t.name + ' [' + t.mode + ']',
      'Uptime: ' + OMA.Syslog.uptime()
    ];
    var out = [];
    for (var i = 0; i < Math.max(art.length, info.length); i++) {
      out.push((art[i] || '').padEnd(44) + (info[i] || ''));
    }
    return out;
  }

  /* ------------------------------------------------------------ executor */
  function execute(line, io, silent) {
    var stages = splitPipeline(line);
    if (!stages.length) return;
    var stdin = '';
    stages.forEach(function (stage, si) {
      var toks = tokenize(stage);
      if (!toks.length) return;
      var name = toks[0], args = toks.slice(1);

      /* redirection */
      var redirect = null, append = false, filtered = [];
      for (var i = 0; i < args.length; i++) {
        if (args[i] === '>' || args[i] === '>>') { redirect = args[i + 1]; append = args[i] === '>>'; i++; continue; }
        filtered.push(args[i]);
      }
      args = filtered;

      var buf = [];
      var sub = Object.create(io);
      sub.out = function (s) { buf.push(s == null ? '' : String(s)); };
      sub.err = function (s) { buf.push(OMA.Themes.current.red + (s == null ? '' : String(s)) + '\u0000reset'); };
      sub.h = function (s) { buf.push('\u0000html:' + s); };
      sub.table = function (rows, raw) {
        var cols = rows.reduce(function (m, r) { return Math.max(m, r.length); }, 0);
        var widths = [];
        rows.forEach(function (r) { r.forEach(function (c, i) { widths[i] = Math.max(widths[i] || 0, String(c).length); }); });
        rows.forEach(function (r) {
          var line = r.map(function (c, i) { return raw ? String(c).padEnd(widths[i]) : String(c).padEnd(widths[i] + 2); }).join('');
          buf.push(line.replace(/\s+$/, ''));
        });
      };
      sub.stdin = stdin;
      sub.stream = function (lines, done) {
        var i = 0;
        var each = setInterval(function () {
          if (i >= lines.length) {
            clearInterval(each);
            done && done();
            return;
          }
          var s = lines[i++];
          io.out(s);
          OMA.bus.emit('term:line', s);
        }, 110);
      };

      var c = CMDS[name];
      if (!c) {
        io.err('bash: ' + name + ': command not found');
        io.code = 127;
      } else {
        try { c.fn(args, sub); } catch (e) { io.err(name + ': ' + e.message); OMA.log('cmd:' + name, e); }
      }

      var text = buf.join('\n');
      if (redirect) {
        var path = expand(redirect, io.cwd);
        var existing = append ? (FS().read(path) || '') : '';
        FS().write(path, existing + text + '\n');
      } else {
        text.split('\n').forEach(function (l) { io.raw(l); });
      }
      stdin = text;
    });
  }

  /* A tiny sparkline renderer. Deliberately plain canvas 2D: absolute pixel
     coordinates, no transforms, no globalAlpha, no gradients — the boring
     subset that behaves identically in every engine and in headless Chrome. */
  function drawer(canvas, opts) {
    opts = opts || {};
    var ctx = canvas.getContext('2d');
    var N = opts.points || 120;
    var series = opts.series || 1;
    var max = opts.max || 100;
    var cols = opts.colors || [OMA.Themes.current.accent];
    var data = [];
    for (var i = 0; i < N; i++) data.push(new Array(series).fill(0));

    function push(vals) {
      data.push(vals.slice(0, series));
      if (data.length > N) data.shift();
      draw();
    }

    function draw() {
      var cw = canvas.clientWidth || canvas.width;
      var ch = canvas.clientHeight || canvas.height;
      if (!cw || !ch) return;
      if (canvas.width !== cw || canvas.height !== ch) {
        canvas.width = cw;
        canvas.height = ch;
      }
      var theme = OMA.Themes.current;

      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, cw, ch);
      ctx.globalAlpha = 1;
      ctx.lineJoin = 'round';

      /* quarter grid */
      ctx.strokeStyle = OMA.Themes.alpha(theme.muted, 0.3);
      ctx.lineWidth = 1;
      for (var g = 1; g < 4; g++) {
        var gy = (ch / 4) * g;
        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(cw, gy); ctx.stroke();
      }

        var col = cols[s % cols.length];

          var v = Math.max(0, Math.min(max, data[k][s] || 0));
          pts.push([(k / (data.length - 1)) * cw, ch - (v / max) * (ch - 4) - 2]);

        ctx.beginPath();
        ctx.moveTo(pts[0][0], ch);
        for (var a = 0; a < pts.length; a++) ctx.lineTo(pts[a][0], pts[a][1]);
        ctx.lineTo(pts[pts.length - 1][0], ch);
        ctx.closePath();
        ctx.fillStyle = OMA.Themes.alpha(col, 0.18);
        ctx.fill();
        /* the curve itself */
        ctx.beginPath();
        for (var b = 0; b < pts.length; b++) {
          if (b === 0) ctx.moveTo(pts[b][0], pts[b][1]);

          body.appendChild(sel);
        } else {
          body.appendChild(h('div.installer-q', { text: 'Ready to install.' }));
          body.appendChild(h('div.installer-disk', {
            text: 'Keyboard    ' + state.layout + '\n' +
              'Disk        ' + (state.disk === 'full' ? 'full disk (nvme0n1)' : 'free space') + '\n' +
              'Encryption  ' + (state.encrypt ? 'LUKS2 + argon2id' : 'none') + '\n' +
              'Account     ' + state.name + ' <' + state.email + '> (' + state.user + ')\n' +
              'Hostname    ' + state.host + '\n' +
              'Extras      ' + Object.keys(state.extras).filter(function (k) { return state.extras[k]; }).join(', ') + '\n' +
              'Theme       ' + OMA.Themes.byId(state.theme).name
          }));
          var logEl = h('div.installer-disk', { text: '' });
          body.appendChild(logEl);
          var lines = [
            'creating partitions…',
            'formatting nvme0n1p1 as vfat…',
            'formatting nvme0n1p2 as btrfs (compress=zstd)…',
            state.encrypt ? 'setting up LUKS2 container on nvme0n1p2…' : 'skipping encryption…',
            'creating btrfs subvolumes @ @home @snapshots…',
            'installing base system from the Arch mirror…',
            'installing omarchy packages from pkgs.omarchy.org…',
            'installing linux-omarchy 6.16.4…',
            'installing bootloader (Limine)…',
            'writing the SDDM theme to match ' + OMA.Themes.byId(state.theme).name + '…',
            'setting the default theme to ' + OMA.Themes.byId(state.theme).name + '…',
            'enabling snapper timeline snapshots…',
            'install complete'
          ];
          var li = 0;
          var timer = setInterval(function () {
            if (li >= lines.length) { clearInterval(timer); return; }
            logEl.textContent += '[omarchy] ' + lines[li++] + '\n';
            logEl.scrollTop = logEl.scrollHeight;
          }, 260);
          state._timer = timer;
        }

        panel.appendChild(body);
        panel.appendChild(h('div.installer-foot', [
          h('div.installer-note', { text: state.step === 6 ? 'Enter finishes and boots the desktop.' : 'Enter continues · this wizard reproduces the real flow and changes nothing on your disk.' }),
          h('div', [
            state.step > 0 ? h('button.oma-btn', { text: 'Back', onclick: function () { state.step--; render(); } }) : null,
            h('button.oma-btn.oma-btn-primary', { text: state.step === 6 ? 'Finish and boot' : 'Continue', onclick: next })
          ])
        ]));
        el.appendChild(panel);
      }

      function next() {
        if (state.step === 4) {
          OMA.Store.set('name', state.name);
          OMA.Store.set('user', state.user || 'oma');
          OMA.Store.set('email', state.email);
        }
        if (state.step === 5) OMA.System.setTheme(state.theme, true);
        if (state.step === 6) {
          clearInterval(state._timer);
          if (el.parentNode) el.parentNode.removeChild(el);
          window.removeEventListener('keydown', onKey, true);
          OMA.Store.set('onboarded', true);
          resolve();
          return;
        }
        state.step++;
        render();
      }
      function onKey(e) {
        if (e.key === 'Enter' && e.target.tagName !== 'INPUT') { e.preventDefault(); next(); }
        if (e.key === 'Escape') { e.preventDefault(); next(); }
      }
      window.addEventListener('keydown', onKey, true);
      render();
    });
  }

  /* ----------------------------------------------------------- power off */
  Boot.reboot = function () {
    var el = h('div.installer', [
      h('div', { style: { textAlign: 'center' } }, [
        h('div.boot-title', { text: 'RESTARTING' }),

      window.removeEventListener('keydown', back, true);

  };
  Boot.shutdown = function () {
    var el = h('div.installer', [
      h('div', { style: { textAlign: 'center' } }, [
        h('div.boot-title', { text: 'POWER OFF' }),
        h('div.boot-sub', { text: 'It is now safe to close this tab, or press any key to power back on.', style: { marginTop: '10px' } })
      ])

    function back() {
      window.removeEventListener('keydown', back, true);
      if (el.parentNode) el.parentNode.removeChild(el);
    }

  };

  /* --------------------------------------------------------------- drive */
  Boot.run = function () {
    if (!Boot.enabled) return Promise.resolve();
    var chain = Promise.resolve();
    if (!OMA.Store.get('skipBootMenu')) chain = chain.then(limine);
    chain = chain.then(luks).then(systemd).then(sddm);
    chain = chain.then(function () {
      if (!OMA.Store.get('onboarded')) return installer();

    });
